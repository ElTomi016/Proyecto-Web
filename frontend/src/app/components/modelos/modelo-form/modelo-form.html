<div class="container" id="modelo-form-page">
  <h2>{{ titulo }}</h2>
  <div class="error" *ngIf="error">{{ error }}</div>

  <form id="modelo-form" class="form" [formGroup]="form" (ngSubmit)="guardar()">
    <label>Nombre del modelo
      <input id="modelo-nombre" formControlName="nombreModelo" />
    </label>
    <label>Color
      <input id="modelo-color" formControlName="color" />
    </label>

    <div class="actions">
      <button id="modelo-save-button" class="btn-primary" type="submit" [disabled]="saving">Guardar</button>
      <button id="modelo-cancel-button" class="btn" type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
