<div class="container" id="jugador-form-page">
  <h2>{{ titulo }}</h2>
  <div class="error" *ngIf="error">{{ error }}</div>

  <form id="jugador-form" class="form" [formGroup]="form" (ngSubmit)="guardar()">
    <label>Nombre
      <input id="jugador-nombre" formControlName="nombre" />
    </label>
    <label>Email
      <input id="jugador-email" formControlName="email" />
    </label>
    <label>Teléfono
      <input id="jugador-telefono" formControlName="telefono" />
    </label>

    <div class="actions">
      <button id="jugador-save-button" class="btn-primary" type="submit" [disabled]="saving">Guardar</button>
      <button id="jugador-cancel-button" class="btn" type="button" (click)="cancelar()">Cancelar</button>
    </div>
  </form>
</div>
